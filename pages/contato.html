	<link rel="stylesheet" href="../css/index.css">

<body>
	<header>
		<div class="div-logo"><img class="logotipo" src="../img/logotipo.png" alt="Logo da Confeitaria Sempre Doce"></div>
		<div class="div-menu">
			<h1>Confeitaria Sempre Doce</h1>

	<main class="sobre">
		<h2>Entre em contato</h2>
		<p>Faça seu pedido pelo telefone (00) 00000-0000 ou envie uma mensagem:</p>
		<form action="#" method="post">
			<p><label for="nome">Nome</label><br><input id="nome" name="nome" type="text" required></p>
			<p><label for="mensagem">Mensagem</label><br><textarea id="mensagem" name="mensagem" rows="5" required></textarea></p>
			<button type="submit">Enviar mensagem</button>
		</form>
	</main>
</body>
